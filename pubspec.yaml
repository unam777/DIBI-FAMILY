name: dibi_family
description: "Dibi Family - Accounting & Group Contribution App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  cinetpay: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.4
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10
  pdf: ^3.10.4
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/kota_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/google_g.svg
